name: mini-lab
prefix: ""

mgmt:
  network: bridge

topology:
  defaults:
    kind: linux
  nodes:
    exit:
      image: quay.io/frrouting/frr:10.3.0
      network-mode: none
      binds:
        - files/exit/daemons:/etc/frr/daemons
        - files/exit/frr.conf:/etc/frr/frr.conf
        - files/exit/vtysh.conf:/etc/frr/vtysh.conf
        - files/exit/network.sh:/root/network.sh
      exec:
        - sh /root/network.sh
    external_service:
      image: docker.io/library/nginx:alpine-slim
      network-mode: none
      binds:
        - files/external_service/network.sh:/root/network.sh
      exec:
        - sh /root/network.sh
    mini_lab_ext:
      kind: bridge
    leaf01:
      group: leaves
      image: ${MINI_LAB_SONIC_IMAGE}
      labels:
        ansible-group: container_sonic
      binds:
        - files/ssh/id_ed25519.pub:/authorized_keys:ro
        - files/sonic-container/leaf01_config_db.json:/config_db.json.init:ro
      stages:
        healthy:
          exec:
            # date is a dummy command. To run an on-exit exec
            # stage, containerlab must wait for the docker healthcheck to pass
            # so the deploy blocks until the switch is actually ready. This is
            # needed because sshd answers way before the switch is ready
            - command: date
              phase: on-exit
    leaf02:
      group: leaves
      image: ${MINI_LAB_SONIC_IMAGE}
      labels:
        ansible-group: container_sonic
      binds:
        - files/ssh/id_ed25519.pub:/authorized_keys:ro
        - files/sonic-container/leaf02_config_db.json:/config_db.json.init:ro
      stages:
        healthy:
          exec:
            - command: date
              phase: on-exit
    machine01:
      group: machines
      image: ${MINI_LAB_VM_IMAGE}
      env:
        UUID: 00000000-0000-0000-0000-000000000001
    machine02:
      group: machines
      image: ${MINI_LAB_VM_IMAGE}
      env:
        UUID: 00000000-0000-0000-0000-000000000002
  links:
    - endpoints: ["exit:mini_lab_ext", "mini_lab_ext:exit"]
      mtu: 9000
    - endpoints: ["external_service:mini_lab_ext", "mini_lab_ext:external_service"]
      mtu: 9000
    - endpoints: ["leaf01:eth1", "machine01:lan0"] # Ethernet0
    - endpoints: ["leaf02:eth1", "machine01:lan1"] # Ethernet0
    - endpoints: ["leaf01:eth2", "machine02:lan0"] # Ethernet1
    - endpoints: ["leaf02:eth2", "machine02:lan1"] # Ethernet1
    - endpoints: ["leaf01:eth3", "exit:eth1"] # Ethernet120
    - endpoints: ["leaf02:eth3", "exit:eth2"] # Ethernet120
