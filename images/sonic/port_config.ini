# sonic-vpp uses a simple script to generate vpp interfaces from the port_config.init on first boot
# No breakouts are supported and it always expects Ethernet$(4*n) as port names
# Just continue the pattern if you want vpp to not crash
# name          lanes                 alias        index  speed
Ethernet0       1,2,3,4               Eth1         1      100000
Ethernet4       5,6,7,8               Eth2         2      100000
Ethernet8       9,10,11,12            Eth3         3      100000