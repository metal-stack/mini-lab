---
- name: Create webhook namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ webhook_namespace }}"

- name: Build webhook target args
  set_fact:
    webhook_target_args: "{{ webhook_target_args | default([]) + ['--target=' + item.namespace + '/' + item.service + '=' + item.ip] }}"
  loop: "{{ webhook_targets }}"

- name: Build webhook target namespaces
  set_fact:
    webhook_target_namespaces: "{{ webhook_targets | map(attribute='namespace') | list }}"

- name: Build webhook target service names
  set_fact:
    webhook_target_service_names: "{{ webhook_targets | map(attribute='service') | list | unique }}"

- name: Deploy webhook certificate secret
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Secret
      type: kubernetes.io/tls
      metadata:
        name: webhook-serving-cert
        namespace: "{{ webhook_namespace }}"
      data:
        tls.crt: "{{ lookup('file', 'certs/webhook/server.pem') | b64encode }}"
        tls.key: "{{ lookup('file', 'certs/webhook/server-key.pem') | b64encode }}"

- name: Deploy webhook
  kubernetes.core.k8s:
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ webhook_deployment_name }}"
        namespace: "{{ webhook_namespace }}"
        labels:
          app: "{{ webhook_deployment_name }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: "{{ webhook_deployment_name }}"
        template:
          metadata:
            labels:
              app: "{{ webhook_deployment_name }}"
          spec:
            containers:
              - name: webhook
                image: "{{ webhook_image }}"
                imagePullPolicy: IfNotPresent
                args: "{{ ['--cert-dir=/certs', '--webhook-port=9443'] + webhook_target_args }}"
                ports:
                  - name: webhook
                    containerPort: 9443
                volumeMounts:
                  - name: cert
                    mountPath: /certs
                    readOnly: true
                securityContext:
                  readOnlyRootFilesystem: true
                  allowPrivilegeEscalation: false
            volumes:
              - name: cert
                secret:
                  secretName: webhook-serving-cert

- name: Deploy webhook service
  kubernetes.core.k8s:
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ webhook_service_name }}"
        namespace: "{{ webhook_namespace }}"
      spec:
        selector:
          app: "{{ webhook_deployment_name }}"
        ports:
          - port: 443
            targetPort: webhook

- name: Deploy mutating webhook configuration
  kubernetes.core.k8s:
    definition:
      apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingWebhookConfiguration
      metadata:
        name: mini-lab-loadbalancer-ip
      webhooks:
        - name: loadbalancer-ip.webhook.mini-lab
          admissionReviewVersions: ["v1"]
          sideEffects: None
          failurePolicy: Fail
          matchPolicy: Equivalent
          clientConfig:
            service:
              name: "{{ webhook_service_name }}"
              namespace: "{{ webhook_namespace }}"
              path: "/mutate-services"
              port: 443
            caBundle: "{{ lookup('file', 'certs/ca.pem') | b64encode }}"
          rules:
            - apiGroups: [""]
              apiVersions: ["v1"]
              operations: ["CREATE", "UPDATE"]
              resources: ["services"]
          namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: "{{ webhook_target_namespaces }}"
          objectSelector:
            matchFields:
              - key: metadata.name
                operator: In
                values: "{{ webhook_target_service_names }}"
