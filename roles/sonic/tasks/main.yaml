---
- name: Install frr-pythontools
  ansible.builtin.import_tasks: frr-reload.yaml

# Disables GRO on the front panel NICs. Required for the sonic-vs dataplane to
# forward without corrupting TCP checksums - without it machines never finish
# PXE booting. See the comment in the imported file before touching this.
- name: Fix Network Performance
  ansible.builtin.import_tasks: fix-network-performance.yaml

- name: Activate IP MASQUERADE on eth0
  ansible.builtin.iptables:
    chain: POSTROUTING
    jump: MASQUERADE
    out_interface: eth0
    table: nat

- name: Activate ipv4 forwarding on eth0
  ansible.posix.sysctl:
    name: net.ipv4.conf.eth0.forwarding
    reload: no
    sysctl_set: yes
    value: "1"

# # We need to fill some values for the sonic-exporter (uses the STATE_DB)
# - name: Mock sonic platform for kvm
#   ansible.builtin.import_tasks: mock-platform.yaml

# ntp restarting for monitoring -> otherwise some NodeTimeOutOfSync error
- name: restart chrony
  systemd:
    name: chrony
    state: restarted
